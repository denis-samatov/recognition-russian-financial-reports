name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  software-and-native-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_TESSERACT_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real OCR engine and fixture font
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus fonts-dejavu-core
          tesseract --version
          tesseract --list-langs
      - name: Install maintained compatible Python profile and package
        run: |
          python -m pip install --require-hashes -r requirements-execution.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Exercise software and required native-engine contracts
        run: python -m pytest tests -q
      - name: Build package
        run: python -m build --wheel --no-isolation
